# prek configuration for terraform-authentik-application.
#
# prek (https://prek.j178.dev) is a drop-in pre-commit replacement and reads
# this standard pre-commit config. Your shell may alias `pre-commit` to `prek`.
#
# Install:  brew install prek && prek install
# Run:      prek run --all-files
#
# The terraform hooks auto-detect the binary to use: `terraform` when present,
# falling back to `tofu` (OpenTofu) otherwise. `terraform-docs`, `conftest`, and
# prek itself must be installed (brew: terraform-docs, conftest, prek).
#
# Terraform linting is provided by conftest (Open Policy Agent/Rego). The
# policies live in `policy/` and are applied to the repository root by the
# `conftest_terraform` hook below; the policies themselves filter to *.tf files.
#
# The `terraform_docs` hook regenerates README.md locally using the system
# terraform-docs. CI regenerates it with the pinned terraform-docs image
# (see .github/workflows/docs.yml); if your local version differs from the
# pin, CI may rewrite README.md back to the pinned version's formatting.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args:
          - --maxkb=512
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt

      - id: terraform_validate
        args:
          - --args=-no-color

      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml

  - repo: local
    hooks:
      # Format the Rego policies before they are verified/applied.
      - id: conftest_fmt
        name: conftest fmt (policy formatting)
        description: Format the Rego policies in policy/.
        entry: conftest fmt
        language: system
        files: ^policy/.*\.rego$
        require_serial: true

      # Unit-test the policies themselves.
      - id: conftest_verify
        name: conftest verify (policy tests)
        description: Run the Rego unit tests for the policies in policy/.
        entry: conftest verify --policy policy --no-color
        language: system
        files: ^policy/.*\.rego$
        pass_filenames: false
        require_serial: true

      # Apply the policies to every Terraform source file. The root scan is
      # combined so cross-file policies see each module directory as a whole;
      # most policies ignore everything that is not *.tf, while the protocol
      # test-coverage policy reads the *.tftest.hcl / *.tofutest.hcl suites.
      # Downloaded .terraform contents are excluded here. Test files are
      # included in `files:` so a test-only commit still runs the coverage
      # policy.
      - id: conftest_terraform
        name: conftest (Terraform policies)
        description: Validate Terraform sources against the Rego policies in policy/.
        entry: conftest test --policy policy --combine --no-color --ignore '[.]terraform' .
        language: system
        files: ^(.*\.tf|.*\.(tftest|tofutest)\.hcl)$
        pass_filenames: false
        require_serial: true

      # Run the module's native interface test suite. OpenTofu only here: it is
      # the engine the validate workflow runs, and running both locally would
      # force a re-init between them (the engines resolve the provider from
      # different registries). Terraform is covered by the provider-matrix
      # workflow.
      - id: terraform_test
        name: tofu test (module interface tests)
        description: Run the native *.tofutest.hcl interface test suites.
        entry: bash -c 'tofu init -input=false -no-color >/dev/null && tofu test -no-color'
        language: system
        files: ^(.*\.tf|tests/.*\.(tftest|tofutest)\.hcl)$
        pass_filenames: false
        require_serial: true
