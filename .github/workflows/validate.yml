name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.x
          tofu_wrapper: false

      - name: Install terraform-docs
        run: |
          curl -fsSL https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz -o /tmp/tfdocs.tar.gz
          tar -xzf /tmp/tfdocs.tar.gz -C /usr/local/bin terraform-docs

      - name: Install tflint
        run: |
          curl -fsSL https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip -o /tmp/tflint.zip
          unzip /tmp/tflint.zip -d /usr/local/bin

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
