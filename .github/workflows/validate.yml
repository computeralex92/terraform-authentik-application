name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.x
          tofu_wrapper: false

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.71.0
        run: |
          case "$(uname -m)" in
            x86_64) asset="Linux_x86_64" ;;
            aarch64 | arm64) asset="Linux_arm64" ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="conftest_${CONFTEST_VERSION}_${asset}.tar.gz"
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/checksums.txt"
          grep " ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
          conftest --version

      - name: Run pre-commit hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # README.md regeneration is handled by the docs workflow (pinned
          # terraform-docs image); validate does not install terraform-docs.
          SKIP: terraform_docs
